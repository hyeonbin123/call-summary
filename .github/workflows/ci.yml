# CI: main에 push할 때와 pull request마다 돈다. Actions 탭의 'Run workflow'로 손으로도 돌릴 수 있다(workflow_dispatch).
# 두 작업은 서로 기다리지 않고 나란히 돈다.
# - test: 기본 의존성과 dev 그룹(uv가 기본으로 설치하는 그룹)으로 ruff 린트·포맷 확인과 pytest. 학습용 train 그룹(torch
#   등)·모델·GPU는 쓰지 않는다
# - audit: uv.lock에 고정된 모든 패키지를 pip-audit으로 공개 취약점 권고와 대조한다. 알리기만 하고 워크플로를 막지 않는다
#   (아래 audit 작업의 설명)
#
# 공급망 설정 (GitHub 문서 "Security hardening for GitHub Actions"의 권고):
# - permissions: 모든 작업의 GITHUB_TOKEN을 저장소 내용 읽기로만 줄인다. 이 워크플로는 저장소에 아무것도 쓰지 않는다
# - 외부 액션은 태그가 아니라 커밋 SHA로 고정한다. 태그는 나중에 다른 커밋으로 옮겨질 수 있어 같은 이름으로 다른 코드가 돌 수
#   있다. 줄 끝 주석은 그 SHA를 가리키는 릴리스 태그다. 올릴 때는 손으로 바꾼다: 새 태그의 커밋을
#   `gh api repos/<소유자>/<저장소>/commits/<태그> --jq .sha`로 확인하고 SHA와 주석을 함께 고친다
# - checkout의 persist-credentials: false: checkout이 끝난 뒤 토큰을 git 인증 설정에 남기지 않는다. 뒤 단계는 원격 저장소에
#   접근하지 않으므로 필요 없고, 남겨 두면 테스트나 uvx로 받아 실행하는 도구 같은 뒤 단계의 프로그램이 읽을 수 있다
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 손으로 돌리기: 코드를 바꾸지 않고 audit 작업이 그사이 공개된 권고를 다시 보게 할 때 쓴다. 권고는 저장소가 쉬는 동안에도
  # 공개되지만 push가 없으면 드러나지 않는다. 주기 실행(schedule)은 저장소에 정기 알림을 만드는 지속 설정이라 넣지 않았다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-uv는 움직이는 큰 버전 태그(v10 같은)를 내지 않으므로 정확한 릴리스 하나의 SHA로 고정한다.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  # 공개 취약점 권고 대조. uv.lock의 모든 그룹(학습용 train 포함)·모든 플랫폼·모든 파이썬 갈래의 고정 판을 PyPI의 권고
  # 정보(pip-audit 기본)와 대조한다. 패키지를 설치하지 않고(--disable-pip, --no-deps) 고정된 `이름==판`만 본다. 설치하는
  # 방식이면 torch와 CUDA 패키지 수 GB를 받아야 한다.
  # - continue-on-error: 새 권고가 공개된 날 코드와 상관없는 push·PR이 막히지 않게 이 작업이 실패해도 워크플로는 통과한다.
  #   이 작업만 실패로 표시되므로, 보면 판단해서 올리거나(`uv lock --upgrade-package <패키지>`) 이유를 적고 아래 목록에 더한다
  # - 줄 고르기: uv export 줄에서 환경 표시(`; sys_platform == 'linux'` 등)를 떼어 러너와 상관없이 모든 플랫폼의 항목을 보고,
  #   로컬 판 꼬리(torch의 `+cu128`)를 뗀다. 꼬리가 붙은 판은 PyPI에 없어 pip-audit가 대조하지 못하고 건너뛰기만 한다.
  #   --strict는 이렇게 대조하지 못한 패키지가 하나라도 있으면 실패하게 해, 조용히 빠지는 패키지가 없게 한다
  # - 같은 이름이 판을 달리해 또 나오면(numpy·networkx처럼 python 3.12 이상에서 다른 판을 고르는 갈래) pip-audit가 한 목록
  #   안의 같은 이름을 거절하므로, 둘째부터는 다음 목록(audit-2.txt …)으로 나눠 따로 대조한다
  # - 받아들인 권고(이유는 docs/experiments.md "재측정 결과 (2026-10-14 ~ 10-15)"의 2026-10-29 덧붙임):
  #   PYSEC-2025-194(torch 2.11.0, CVE-2025-3000: torch.jit.script의 메모리 손상. 이 저장소와 학습·추론 경로는 그 함수를
  #   부르지 않고, 고친 판 2.13.0은 쓰는 CUDA 12.8 채널에 없으며 torch는 측정 환경이라 올리지 않는다),
  #   PYSEC-2026-3447·GHSA-xmj3-9gf7-h52w(setuptools 81.0.0: sdist를 만들 때의 MANIFEST.in 제외 규칙, Windows의 옛 egg 설치
  #   경로. 이 저장소는 둘 다 쓰지 않고, 고친 판 83.0.0·84.1.0은 torch 2.11.0의 요구 `setuptools<82`가 막는다)
  # - pip-audit 판은 고정한다(2.10.1). 결과 표는 이 단계의 로그에 남는다
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # shell: bash는 pipefail을 켠다(기본 셸은 bash -e뿐이라 파이프 앞쪽 명령이 실패해도 지나간다).
      - name: Audit the locked dependencies
        shell: bash
        run: |
          uv export --frozen --all-groups --format requirements-txt --no-hashes --no-emit-project > "$RUNNER_TEMP/locked.txt"
          grep -E '^[A-Za-z0-9]' "$RUNNER_TEMP/locked.txt" \
            | sed -E -e 's/[[:space:]]*;.*$//' -e 's/\+[^[:space:]]*$//' > "$RUNNER_TEMP/pinned.txt"
          awk -F'==' -v dir="$RUNNER_TEMP" '{
            name = tolower($1); gsub(/[-_.]+/, "-", name)
            print > (dir "/audit-" (++seen[name]) ".txt")
          }' "$RUNNER_TEMP/pinned.txt"
          status=0
          for list in "$RUNNER_TEMP"/audit-*.txt; do
            echo "== $(basename "$list"): $(wc -l < "$list") packages"
            uvx pip-audit==2.10.1 -r "$list" --no-deps --disable-pip --strict --progress-spinner off \
              --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w || status=1
          done
          exit "$status"
