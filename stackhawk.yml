# HawkScan (StackHawk) configuration. No secrets in this file. The scan target is the service without a model
# (canned replies), which serves its OpenAPI description:
#
#   uv run uvicorn call_summary.service:create_offline_app --factory --port 8072
#   APP_ID=<application id> hawk scan
app:
  applicationId: ${APP_ID}
  env: ${APP_ENV:Development}
  host: ${APP_HOST:http://127.0.0.1:8072}
  openApiConf:
    path: /openapi.json
hawk:
  spider:
    # The engine sends the /summarize bodies it builds from the OpenAPI description in ISO-8859-1, so the
    # Korean speaker values arrive as "???" and every request stops at validation (422, scan of 2026-10-03).
    # This recorded request keeps its body ASCII (JSON \u escapes), so the request encoding cannot change it.
    har:
      file:
        paths:
          - hawk/summarize.har
tags:
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: git_origin
    value: hyeonbin123/call-summary
