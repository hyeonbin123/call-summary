# README 머리말과 결과 요약의 평가 실행 수치를 실행 기록(reports/<run_id>/)에 묶는 선언.
#
# 확인 (저장소 뿌리에서, 모델·GPU 없이 몇 초):
#   uv run --no-sync python -m call_summary.compare --check docs/numbers.toml
# 선언마다 (1) where 파일의 section 절에 context 글이 꼭 한 번 있고 그 글이 value로 끝나는지 (2) run(짝지은
# 차이면 run과 base)의 건별 점수(items.jsonl)에서 다시 낸 값을 places 자리로 반올림하면 value와 같은지
# (3) 측정 때 evaluate가 쓴 summary.json도 같은 값인지를 보고, 하나라도 어긋나면 종료 코드 1로 끝난다.
# tests/test_numbers.py가 같은 검사를 돌리므로 CI가 push마다 확인한다.
#
# 키
#   where    숫자가 적힌 파일 (저장소 뿌리 기준)
#   section  그 파일의 제목 글(# 없이). 이 제목 아래, 다음 같은 수준 이상의 제목 전까지에서 context를 찾는다.
#            코드 울타리 안의 # 줄은 제목이 아니다. 빼면 파일 전체
#   context  그 자리에 그대로 있어야 할 글. 선언한 값으로 끝나야 하고(값 뒤의 %, %p, ], **, |는 붙어도 된다)
#            그 절에서 꼭 한 번 나와야 한다. 같은 숫자가 다른 곳에 있어서 통과하는 일을 막으려는 것이다.
#            표의 칸은 그 행의 앞에서부터 그 칸까지를 적는다
#   kind     point  = 점 추정 하나
#            ci     = [점 추정, 95% 하한, 상한]. 건 단위 부트스트랩 seed 0, 2,000번 (evaluate와 같다)
#            paired = 짝지은 차이 run − base (%p). 차이 하나 또는 [차이, 하한, 상한]. 같은 건 id를 양쪽에서
#                     함께 다시 뽑는 부트스트랩 seed 0, 2,000번 (compare --paired와 같다)
#   metric   scoring.METRICS의 이름 (exact, hallucination 등). 값은 백분율이다
#   run      실행 폴더. paired면 빼는 쪽 base도 적는다
#   value    README에 적힌 값 (+ 기호 없이, 빼기는 음수로)
#   places   README에 적힌 소수 자리 수 (기본 1)
#
# 범위: README 머리말과 결과 요약의 평가 실행 수치(표의 exact와 구간, 본문의 짝지은 차이와 환각 비율)만
# 선언한다.
# 아직 다시 내지 않는 것: 지연·효율(bench, loadtest), 요약 판정(judge_run, judge_calib, value_facts), 번호
# 표시(verify), 음성 조건 입력 분석(asr_report, asr_arms), 정답 잡음 감사(label_audit), 숫자 없이 적은 판정
# 문장("구간 하한이 모두 0보다 크다", "구간 모두 ±3%p 안" 등), 범위 글("0~1.5%")의 가운데 값(양 끝 값만 선언),
# 진단 실행(outputs/, 커밋하지 않음)에서 나온 "약 7%p". README에 평가 실행 수치를 더하거나 고칠 때는 이 파일도
# 함께 고친다.


